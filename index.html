<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Web</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .calculadora {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }
    h2 {
      margin-bottom: 15px;
      color: #333;
    }
    input {
      width: 100px;
      padding: 10px;
      margin: 5px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #45a049;
      transform: scale(1.05);
    }
    #resultado {
      font-weight: bold;
      font-size: 20px;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="calculadora">
    <h2>✨ Calculadora Web ✨</h2>
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2"><br>

    <button onclick="calcular('+')">➕</button>
    <button onclick="calcular('-')">➖</button>
    <button onclick="calcular('*')">✖️</button>
    <button onclick="calcular('/')">➗</button>

    <h3>Resultado: <span id="resultado"></span></h3>
  </div>

  <script>
    function calcular(op) {
      let n1 = parseFloat(document.getElementById('num1').value);
      let n2 = parseFloat(document.getElementById('num2').value);
      let res = 0;

      switch(op) {
        case '+': res = n1 + n2; break;
        case '-': res = n1 - n2; break;
        case '*': res = n1 * n2; break;
        case '/': res = n2 !== 0 ? n1 / n2 : "Error"; break;
      }
      document.getElementById('resultado').innerText = res;
    }
  </script>
</body>
</html>
